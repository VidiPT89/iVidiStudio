name: CI (painel)

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".claude/hooks/**", ".github/workflows/ci.yml"]
  pull_request:

jobs:
  painel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run snapshot
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
