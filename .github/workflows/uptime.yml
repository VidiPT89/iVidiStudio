name: Uptime (Cave)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sites
        id: check
        run: |
          falhas=""
          for url in https://ividi.dev https://portal.ividi.dev; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$url" || true)
            echo "$url → ${code:-000}"
            if [ -z "$code" ] || [ "$code" = "000" ] || [ "$code" -ge 500 ]; then falhas="$falhas $url(${code:-000})"; fi
          done
          echo "falhas=${falhas# }" >> "$GITHUB_OUTPUT"
      - name: Abrir ticket P0 na entrada
        if: steps.check.outputs.falhas != ''
        run: |
          .github/scripts/ticket-uptime.sh "${{ steps.check.outputs.falhas }}"
          git add elevador/entrada
          git -c user.name="David Arsénio Martins" -c user.email="210453312+VidiPT89@users.noreply.github.com" \
            commit -q -m "fix(infraestrutura): site em baixo"
          git push
