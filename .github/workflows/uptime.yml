name: Uptime (Cave)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar sites
        run: |
          falhas=""
          for url in https://ividi.dev https://portal.ividi.dev; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$url" || true)
            echo "$url → ${code:-000}"
            if [ -z "$code" ] || [ "$code" = "000" ] || [ "$code" -ge 500 ]; then falhas="$falhas $url(${code:-000})"; fi
          done
          # A failed run makes GitHub email the repository owner: that is the alert.
          if [ -n "$falhas" ]; then echo "::error::Site em baixo:$falhas"; exit 1; fi
